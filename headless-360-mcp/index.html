<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- TITLE: change this -->
<title>Headless 360 MCP Server</title>
<!-- Favicon: local PNG wrapped in an SVG circular clip so the tab icon renders as a circle. -->
<link rel="icon" type="image/svg+xml" href="./vendor/favicon.svg" />
<link rel="apple-touch-icon" href="./vendor/favicon-src.png" />
<!-- Vendored React + Babel: fully offline, no network, no build step.
     These three files must sit in ./vendor/ next to this HTML. -->
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/babel.min.js"></script>
<style>
  /* ---------- DESIGN TOKENS ----------
     Every color the diagram uses is a variable here. Retheme the whole
     thing by editing this block — nothing downstream hardcodes a hex.
     The default palette is a calm blue "enterprise" look; swap the accents
     for your brand and the nodes, edges, pulses, and chips all follow. */
  :root {
    --navy: #032D60;      /* deepest brand color — topbar, headings */
    --navy-2: #01214a;
    --blue: #0176D3;      /* primary accent — active edges/nodes, arrowheads */
    --blue-lt: #57a3f3;
    --sky: #e8f3ff;       /* pale accent tint — chips, nav hovers */
    --ink: #0b1b33;       /* body text */
    --slate: #5c6b82;     /* secondary text, inactive edges */
    --line: #d6e2f2;      /* borders, inactive strokes */
    --panel: #ffffff;
    --canvas: #f4f8fe;    /* diagram background */
    --bg: #eef4fb;        /* page background */
    --good: #2e844a;      /* return/success edges */
    --warn: #a86403;
    --danger: #ba0517;    /* context-window-full alert */
    --sec: #7526e3;       /* secondary accent — a distinct node/edge role */
    --shadow: 0 1px 3px rgba(3,45,96,.12), 0 6px 24px rgba(3,45,96,.10);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  #root { height: 100vh; }

  /* ---------- Layout ---------- */
  .app { display: grid; grid-template-rows: 46px 1fr; height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 0 20px;
    background: linear-gradient(90deg, var(--navy) 0%, var(--navy-2) 60%, var(--blue) 160%);
    color: #fff; box-shadow: var(--shadow); z-index: 20; height: 46px; }
  .brandlogos { display: flex; align-items: center; gap: 7px; background: #fff; border-radius: 10px; padding: 5px 9px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .lockup { display: flex; flex-direction: column; justify-content: center; line-height: 1.2; }
  .lockup .title { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
  .lockup .from { opacity: .82; font-weight: 400; font-size: 11.5px; }
  .topbar .spacer { flex: 1; }
  .badge-chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.35);
    background: #0176D3; color: #fff; border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 600; }
  a.badge-chip { text-decoration: none; transition: background .15s ease, border-color .15s ease, box-shadow .15s ease; }
  a.badge-chip:hover { background: #014486; border-color: rgba(255,255,255,.6); box-shadow: 0 2px 8px rgba(1,118,211,.45); }
  .badge-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #cfe6ff; box-shadow: 0 0 0 3px rgba(207,230,255,.35); }
  .badge-chip .ext-icon { width: 12px; height: 12px; opacity: .95; }

  .body { display: grid; grid-template-columns: 268px 1fr; min-height: 0; }

  /* ---------- Side rail (scenario switcher + legend) ---------- */
  .rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 0; }
  .rail-steps { flex: none; padding: 10px 12px 10px; border-bottom: 1px solid var(--line); }
  .rail-step-dots { display: flex; gap: 4px; }
  .rail-step-dot { flex: 1; height: 10px; border-radius: 4px; background: var(--line); cursor: pointer; transition: background .15s; }
  .rail-step-dot.done { background: var(--blue-lt); }
  .rail-step-dot.active { background: var(--blue); }
  .rail-narrator { flex: 1; overflow-y: auto; padding: 14px 12px 16px; display: flex; flex-direction: column; gap: 18px; }
  .rail-section-label { font-size: 10px; font-weight: 800; color: var(--blue); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; }
  .rail-narration { font-size: 13px; line-height: 1.55; color: var(--ink); }
  .rail-hood-body { font-size: 12px; line-height: 1.5; color: var(--slate); }
  .rail-nav { flex: none; display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
  .rail-nav .btn { flex: 1; text-align: center; padding: 7px 4px; font-size: 12px; }

  /* ---------- Main scene ---------- */
  .main { overflow: hidden; padding: 10px 14px 10px; min-width: 0; display: flex; flex-direction: column; }
  .main .canvas-wrap { flex: 1; min-height: 0; height: 100%; }
  .main .canvas-svg { width: 100%; height: 100%; }
  .scene-head { margin-bottom: 6px; flex: none; }
  .scene-head .eyebrow { font-size: 11px; color: var(--blue); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
  .scene-head h1 { font-size: 18px; margin: 2px 0 0; color: var(--navy); }
  .scene-head .headline { display: none; }

  /* ---------- Graph canvas ----------
     Edges are SVG paths. Their look is driven entirely by class:
       .edge            inactive (grey, thin)
       .edge.active     lit for the current step (accent, thick)
       .edge.active.flow  + marching-ants animation (the "traffic is moving" cue)
       .edge.ret        a return/response edge (dashed, drops to a baseline lane)
     The @keyframes flow drift is the single most important animation here —
     it's what makes a lit edge read as *live data moving*, not just highlighted. */
  .canvas-wrap { background: var(--canvas); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .canvas-svg { display: block; width: 100%; height: auto; }
  .edge { fill: none; stroke: #c2d2e8; stroke-width: 2; transition: stroke .3s, stroke-width .3s; }
  .edge.active { stroke: var(--blue); stroke-width: 3; }
  .edge.active.flow { stroke-dasharray: 7 7; animation: flow 700ms linear infinite; }
  .edge.ret { stroke-dasharray: 3 5; }
  .edge.ret.active { stroke: var(--good); }
  @keyframes flow { to { stroke-dashoffset: 14; } }
  /* Plain edge label rendered as an opaque pill (see edge-label-pill JSX) so
     it stays legible near a card; --canvas backing + halo hide any close call. */
  .edge-label-pill { font-size: 10px; color: var(--slate); font-weight: 700; letter-spacing: .3px;
    background: var(--canvas); box-shadow: 0 0 0 3px var(--canvas); border-radius: 4px;
    white-space: nowrap; transition: color .3s; }
  .edge-label-pill.active { color: var(--blue); }
  .edge-label-pill.ret.active { color: var(--good); }
  .edge-label { font-size: 10px; fill: var(--slate); font-weight: 700; letter-spacing: .3px;
    paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; }
  .edge-label.active { fill: var(--blue); }
  .edge-label.ret.active { fill: var(--good); }
  .edge-label-chip { font-size: 10px; }
  .edge-label-chip .help-chip { background: var(--canvas); box-shadow: 0 0 0 4px var(--canvas); }
  .edge-label-chip.active .help-chip { background: var(--sky); box-shadow: 0 0 0 4px var(--canvas); color: var(--blue); }

  /* ---------- Node card (rendered via SVG foreignObject) ----------
     Nodes are real HTML divs placed at SVG coordinates. This is the trick
     that lets a node be a proper flexbox card — logo + wrapping text +
     shadow — instead of a rigid SVG <rect>+<text>. Active nodes pulse; the
     inactive ones dim so the eye tracks the current step. */
  .node-slot { width: 100%; height: 100%; display: flex; align-items: center; }
  .node { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 9px; padding: 12px 11px;
    background: #fff; border: 1.5px solid var(--line); border-radius: 12px; box-shadow: 0 1px 2px rgba(3,45,96,.08);
    transition: border-color .3s, box-shadow .3s, opacity .3s; overflow: visible; }
  .node.dim { opacity: .4; }
  .node.active { border-color: var(--blue); border-width: 2px; animation: nodepulse 1.9s ease-in-out infinite; }
  .node.sec { border-color: var(--sec); }
  .node.sec.active { border-color: var(--sec); animation: secpulse 1.9s ease-in-out infinite; }
  @keyframes nodepulse { 0%,100%{ box-shadow: 0 0 0 3px rgba(1,118,211,.16);} 50%{ box-shadow: 0 0 0 8px rgba(1,118,211,.04);} }
  @keyframes secpulse { 0%,100%{ box-shadow: 0 0 0 3px rgba(117,38,227,.16);} 50%{ box-shadow: 0 0 0 8px rgba(117,38,227,.04);} }
  .node .nlogo { flex: none; width: 28px; height: 28px; display: grid; place-items: center; }
  .node .nemoji { font-size: 20px; line-height: 1; }
  .node .ntext { min-width: 0; flex: 1; }
  .node .ntype { font-size: 8px; text-transform: uppercase; letter-spacing: .5px; font-weight: 800; line-height: 1.1; }
  .node .nlabel { font-size: 11px; font-weight: 700; color: var(--ink); line-height: 1.2; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .nsub { font-size: 9px; color: var(--slate); line-height: 1.12; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Per-type accent color for the little TYPE eyebrow on each card. */
  .n-agent { color: var(--blue); } .n-broker { color: var(--sec); } .n-mcp { color: #0a8a6f; }
  .n-llm { color: #b7791f; } .n-gateway { color: #c2410c; } .n-human { color: #2563eb; } .n-system { color: var(--slate); } .n-resource { color: var(--slate); }
  .node .zt { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: var(--sec); color: #fff; font-size: 8px; font-weight: 800;
    padding: 2px 7px; border-radius: 999px; letter-spacing: .3px; box-shadow: 0 1px 3px rgba(117,38,227,.4); white-space: nowrap; }

  /* ---------- Step narrator ---------- */
  .controls { display: flex; align-items: center; gap: 8px; margin: 8px 0 6px; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--navy); border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: all .12s; }
  .btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
  .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn.primary:hover:not(:disabled) { background: #0161b3; color: #fff; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .steppips { display: flex; gap: 6px; margin-left: 6px; }
  .steppips .pip { width: 26px; height: 5px; border-radius: 3px; background: var(--line); cursor: pointer; transition: background .2s; }
  .steppips .pip.done { background: var(--blue-lt); }
  .steppips .pip.active { background: var(--blue); }
  .stepcount { font-size: 12.5px; color: var(--slate); margin-left: auto; }

  .narrator { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); }
  .narrator .step-n { font-size: 10px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .6px; }
  .narrator .narration { font-size: 13px; line-height: 1.45; margin: 3px 0 0; color: var(--ink); }
  .hood { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .hood summary { cursor: pointer; font-size: 11.5px; font-weight: 700; color: var(--slate); list-style: none; display: flex; align-items: center; gap: 6px; }
  .hood summary::-webkit-details-marker { display: none; }
  .hood summary .chev { transition: transform .15s; }
  .hood[open] summary .chev { transform: rotate(90deg); }
  .hood .hood-body { font-size: 13px; line-height: 1.55; color: var(--slate); margin-top: 8px; }
  code { background: var(--sky); color: var(--navy); padding: 1px 5px; border-radius: 4px; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .note { margin-top: 12px; background: #faf6ff; border: 1px solid #e6d8fb; border-radius: 9px; padding: 10px 12px; font-size: 12.5px; color: var(--sec); font-weight: 600; line-height: 1.5; }

  /* ---------- Review mode (contact sheet) ----------
     Reached via ?review in the URL. Renders EVERY step as a static canvas
     stacked vertically — no controls, no animation — so one screenshot
     captures the whole walkthrough. This is what makes an automated visual
     self-review possible (see scripts/review.sh): a JSX transform can't see a
     label overlapping a card, but a rendered contact sheet can. The canvas
     keeps the SAME width as the live view on purpose — edge labels are a fixed
     10px while cards scale with width, so a wider render would hide overlaps
     that appear in the real diagram. Faithful width = faithful review. */
  .app.review { display: block; height: auto; }        /* free the fixed-height grid so the sheet grows */
  .app.review .main { overflow: visible; height: auto; }
  .review-step { margin: 6px 0 24px; }
  .review-cap { font-size: 12.5px; font-weight: 700; color: var(--navy); margin: 2px 2px 7px; line-height: 1.4; }
  .review-cap .rn { color: var(--blue); text-transform: uppercase; letter-spacing: .5px; margin-right: 6px; }
  .review-cap .help-chip { font-weight: 700; }
  /* Geometry-linter banner atop the review contact sheet. */
  .lint-banner { margin: 8px 2px 18px; padding: 10px 14px; border-radius: 8px; font-size: 12.5px; line-height: 1.5; }
  .lint-banner.ok { background: #e7f6ee; color: #0a6b46; border: 1px solid #b7e3ca; }
  .lint-banner.bad { background: #fdecec; color: #a12020; border: 1px solid #f2c0c0; }
  .lint-banner ul { margin: 6px 0 0; padding-left: 20px; }
  .lint-banner li { margin: 2px 0; }
  .lint-banner code { background: rgba(0,0,0,.06); padding: 0 4px; border-radius: 3px; font-size: 11.5px; }

  /* ---------- Help bubbles (glossary chips) ----------
     A chip can sit inside an SVG <foreignObject> (node/edge labels). Nesting
     each chip's own popup inside that foreignObject is a browser trap: Chrome
     computes a descendant's `position: fixed` against the SVG's internal
     coordinate space once a foreignObject ancestor is in the chain, so the
     popup renders back *inside* the diagram instead of escaping to open
     screen space. Fix: chips are inert triggers only (a span + data-term, no
     nested popup). ONE shared <HelpOverlay> is rendered at the App root — a
     sibling of the diagram, never a foreignObject descendant — and a single
     document-level hover/focus listener shows/hides it. Only ever one popup
     on screen, so two chips can never fight for the same spot. */
  .help-chip { display:inline-flex; align-items:center; gap:4px; background: var(--sky); color: var(--navy); font-weight:700;
    padding: 1px 7px 1px 8px; border-radius: 999px; cursor: help; font-size: inherit; }
  .help-chip .qm { width:13px; height:13px; border-radius:50%; background: var(--blue); color:#fff; font-size:8.5px; font-weight:800; display:grid; place-items:center; flex:none; }

  .help-overlay { position: fixed; top: 74px; right: 26px; width: 360px; max-width: calc(100vw - 52px);
    background: var(--navy); color:#fff; font-size: 14px; font-weight:400; line-height:1.55; padding: 18px 20px 20px; border-radius: 18px;
    box-shadow: 0 14px 38px rgba(3,45,96,.45); opacity:0; pointer-events:none; transition: opacity .15s, transform .15s;
    transform: translateY(-6px) scale(.97); z-index: 100; }
  .help-overlay.show { opacity:1; transform: translateY(0) scale(1); }
  .help-overlay .ho-term { display:block; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--blue-lt); margin-bottom: 6px; }
  .help-overlay .ho-body { display:block; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, Fragment } = React;

/* =====================================================================
   LOGO REGISTRY — inline SVG marks, offline-safe.
   A node can render one of these instead of a generic emoji by setting
   `logo: "<key>"`. Each entry is { vb: "<viewBox>", glyph: <jsx> }.
   Add your own: draw a compact SVG (or paste an official brand path) and
   register it here. Keys included below are neutral, illustrative shapes —
   replace/extend freely. Prefer a real brand mark when depicting a real
   product; keep glyphs simple so they read at 28px.
   ===================================================================== */
const LOGOS = {
  database: { vb: "0 0 24 24", glyph: (
    <g fill="none" stroke="#0176D3" strokeWidth="1.8">
      <ellipse cx="12" cy="6" rx="7" ry="2.6" />
      <path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6" />
      <path d="M5 12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6" />
    </g>
  )},
  cloud: { vb: "0 0 24 24", glyph: (
    <path d="M7 18a4 4 0 01-.5-8A5 5 0 0116 9.5a3.5 3.5 0 01.5 8.5H7z" fill="#0176D3" />
  )},
  gear: { vb: "0 0 24 24", glyph: (
    <g fill="#7526e3"><circle cx="12" cy="12" r="3.2" fill="#fff" stroke="#7526e3" strokeWidth="1.6"/>
    <path d="M12 2l1.2 2.6 2.8-.6.4 2.8 2.6 1.2-1.4 2.5 1.4 2.5-2.6 1.2-.4 2.8-2.8-.6L12 22l-1.2-2.6-2.8.6-.4-2.8-2.6-1.2 1.4-2.5L5 9.8l2.6-1.2.4-2.8 2.8.6z" fillOpacity=".25"/></g>
  )},
  person: { vb: "0 0 24 24", glyph: (
    <g fill="#2563eb"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0116 0z"/></g>
  )},
  // Salesforce cloud mark (simplified, generic — not official brand)
  sfcloud: { vb: "0 0 32 32", glyph: (
    <g>
      <path d="M13.2 7.4a5.6 5.6 0 0110.4 2.9 4.4 4.4 0 01-.3 8.7H9.2a4 4 0 01-.2-8 5.6 5.6 0 014.2-3.6z" fill="#0176D3"/>
    </g>
  )},
  // Stack of tool cards — represents a flat list of many tools
  toolstack: { vb: "0 0 24 24", glyph: (
    <g fill="none" stroke="#c2410c" strokeWidth="1.6">
      <rect x="3" y="15" width="18" height="4" rx="1.5" fill="#fef3c7" stroke="#c2410c"/>
      <rect x="3" y="10" width="18" height="4" rx="1.5" fill="#fed7aa" stroke="#c2410c"/>
      <rect x="3" y="5" width="18" height="4" rx="1.5" fill="#fca5a5" stroke="#c2410c"/>
    </g>
  )},
  // Magnifying glass — represents semantic search / Discover
  search: { vb: "0 0 24 24", glyph: (
    <g fill="none" stroke="#0a8a6f" strokeWidth="2" strokeLinecap="round">
      <circle cx="10.5" cy="10.5" r="6" />
      <path d="M15 15l4.5 4.5" />
    </g>
  )},
  // Context window — a progress bar shape
  ctxbar: { vb: "0 0 24 24", glyph: (
    <g>
      <rect x="2" y="8" width="20" height="8" rx="3" fill="none" stroke="#7526e3" strokeWidth="1.6"/>
      <rect x="3.5" y="9.5" width="17" height="5" rx="2" fill="#e9d5ff"/>
    </g>
  )},
};

function Logo({ name, size = 26 }) {
  const l = LOGOS[name];
  if (!l) return null;
  return <svg width={size} height={size} viewBox={l.vb} aria-label={name} role="img">{l.glyph}</svg>;
}

/* =====================================================================
   GLOSSARY — inline jargon tooltips (optional but great for wide audiences).
   Any term here can be surfaced as a help chip:
     - in prose (headline / narration / hood): splice `${helpHTML("key")}`
     - in JSX (a node label): set `helpTerm: "key"` on the node
   Delete entries you don't need; the chip system no-ops on unknown keys.
   ===================================================================== */
const GLOSSARY = {
  mcp: { term: "MCP", short: "Model Context Protocol — the standard that lets an AI agent call external tools via a typed request/response contract." },
  toolslist: { term: "tools/list", short: "The MCP primitive that returns every tool schema the server exposes. Classic servers call it once at connect-time; the full schema payload is loaded into the agent's context window." },
  ctx: { term: "context window", short: "The fixed-size memory an LLM can reason over in one turn. Every tool schema loaded upfront consumes that space — leaving less room for actual work." },
  discover: { term: "Discover", short: "Semantic search over the indexed Salesforce API corpus. Returns ranked matches (name + description) without loading full schemas — keeps the context window lean." },
  describe: { term: "Describe", short: "Fetches the full OAS spec for one action by ID. Only called after Discover identifies the right action — so only the needed spec hits the context window." },
  dispatch: { term: "Dispatch", short: "Invokes a Salesforce API by passing the HTTP method + path verbatim from a Discover/Describe result. The agent never holds the full schema corpus — just the one path it needs." },
};

// Chips are inert triggers — no popup nested inside them (the foreignObject
// trap). data-help-term is read by one document-level listener that drives
// the single shared <HelpOverlay/>.
function helpHTML(id) {
  const g = GLOSSARY[id];
  if (!g) return id;
  return `<span class="help-chip" tabindex="0" data-help-term="${id}">${g.term}<span class="qm">?</span></span>`;
}
function Help({ id }) {
  const g = GLOSSARY[id];
  if (!g) return null;
  return <span className="help-chip" tabIndex={0} data-help-term={id}>{g.term}<span className="qm">?</span></span>;
}
// Single popup for the whole app — a sibling of every diagram, never inside a
// foreignObject — so it always escapes to real screen space.
function HelpOverlay() {
  const [termId, setTermId] = useState(null);
  useEffect(() => {
    const onOver = (ev) => {
      const chip = ev.target.closest && ev.target.closest(".help-chip");
      if (chip) setTermId(chip.dataset.helpTerm);
    };
    // Only clear when the pointer/focus leaves the chip entirely — moving
    // between a chip's own children must not flicker the popup shut.
    const onOut = (ev) => {
      const leavingChip = ev.target.closest && ev.target.closest(".help-chip");
      if (!leavingChip) return;
      const related = ev.relatedTarget;
      const stillInside = related && related.closest && related.closest(".help-chip") === leavingChip;
      if (!stillInside) setTermId(null);
    };
    document.addEventListener("mouseover", onOver);
    document.addEventListener("mouseout", onOut);
    document.addEventListener("focusin", onOver);
    document.addEventListener("focusout", onOut);
    return () => {
      document.removeEventListener("mouseover", onOver);
      document.removeEventListener("mouseout", onOut);
      document.removeEventListener("focusin", onOver);
      document.removeEventListener("focusout", onOut);
    };
  }, []);
  const g = termId ? GLOSSARY[termId] : null;
  return (
    <div className={"help-overlay" + (g ? " show" : "")}>
      {g ? <span className="ho-term">{g.term}</span> : null}
      {g ? <span className="ho-body">{g.short}</span> : null}
    </div>
  );
}

/* =====================================================================
   GRAPH ENGINE — you rarely need to touch anything below this line.
   It computes edge geometry, lays out node cards, and renders the SVG.
   ===================================================================== */

/* ---- edge geometry (pure functions; also consumed by the geometry linter) ----
   Kept at module scope so the linter can recompute the exact same paths the
   renderer draws, without a browser layout pass. */
const ARROW_GAP = 10;  // px to pull the arrow endpoint back off the target card,
                       // so the arrowhead tip meets the border cleanly instead of
                       // biting into it (the marker tip extends past the endpoint).
const nw = n => n.w ?? NW;
const nh = n => n.h ?? NH;
const nodeCenter = n => ({ x: n.x + nw(n) / 2, y: n.y + nh(n) / 2 });

// Anchor on the box edge facing the connection's dominant axis: horizontal edges
// exit left/right at center height; vertical edges exit top/bottom at center
// width. The Bézier tangent then matches, so arrowheads meet the box edge cleanly
// instead of stabbing a corner.
function anchor(a, b) {
  const ac = nodeCenter(a), bc = nodeCenter(b);
  const dx = bc.x - ac.x, dy = bc.y - ac.y;
  if (Math.abs(dx) >= Math.abs(dy)) {
    return { x: ac.x + (dx >= 0 ? nw(a) / 2 : -nw(a) / 2), y: ac.y, h: true };
  }
  return { x: ac.x, y: ac.y + (dy >= 0 ? nh(a) / 2 : -nh(a) / 2), h: false };
}

// Sample a cubic Bézier into points so the linter can test box-crossing.
function sampleCubic(p0, c1, c2, p3, n = 24) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push({
      x: u*u*u*p0.x + 3*u*u*t*c1.x + 3*u*t*t*c2.x + t*t*t*p3.x,
      y: u*u*u*p0.y + 3*u*u*t*c1.y + 3*u*t*t*c2.y + t*t*t*p3.y,
    });
  }
  return pts;
}

function edgeGeo(byId, e) {
  const a = byId[e.from], b = byId[e.to];
  if (e.kind === "ret") {
    // Return edges drop to a flat baseline LANE and run along it: down the
    // source column, across the lane at RET_Y, up the target column, with
    // rounded corners. Because the whole span sits at RET_Y (below the field),
    // it clears any box above it — unlike a single sagging curve, whose
    // mid-span rides up and can cut straight through a node.
    const p1 = { x: a.x + nw(a) / 2, y: a.y + nh(a) };
    const p2 = { x: b.x + nw(b) / 2, y: b.y + nh(b) };
    const dir = p2.x >= p1.x ? 1 : -1;
    const CR = 16;   // corner radius where the verticals meet the lane
    const d = `M ${p1.x} ${p1.y} V ${RET_Y - CR} Q ${p1.x} ${RET_Y} ${p1.x + dir*CR} ${RET_Y} `
            + `H ${p2.x - dir*CR} Q ${p2.x} ${RET_Y} ${p2.x} ${RET_Y - CR} V ${p2.y}`;
    // Linter samples: the two verticals and the flat run (corners are negligible).
    const pts = [
      { x: p1.x, y: p1.y }, { x: p1.x, y: RET_Y },
      { x: p2.x, y: RET_Y }, { x: p2.x, y: p2.y },
    ];
    return { d, lx: (p1.x + p2.x) / 2, ly: RET_Y + 2, pts, tip: p2 };
  }
  const p1 = anchor(a, b);
  let p2 = anchor(b, a);
  // Inset the target endpoint off the card edge so the arrowhead clears it.
  const ac = nodeCenter(a), bc = nodeCenter(b);
  if (p2.h) p2 = { x: p2.x + Math.sign(ac.x - bc.x) * ARROW_GAP, y: p2.y, h: true };
  else      p2 = { x: p2.x, y: p2.y + Math.sign(ac.y - bc.y) * ARROW_GAP, h: false };
  let c1, c2;
  if (p1.h) {
    // Pull each control point 40% of the horizontal gap from its own endpoint.
    // This keeps the tangent horizontal at both ends and distributes the Y
    // transition across the middle of the curve — no S-kink at the midpoint.
    const pull = Math.abs(p2.x - p1.x) * 0.4;
    const dir  = Math.sign(p2.x - p1.x);
    c1 = { x: p1.x + dir * pull, y: p1.y };
    c2 = { x: p2.x - dir * pull, y: p2.y };
  } else {
    const pull = Math.abs(p2.y - p1.y) * 0.4;
    const dir  = Math.sign(p2.y - p1.y);
    c1 = { x: p1.x, y: p1.y + dir * pull };
    c2 = { x: p2.x, y: p2.y - dir * pull };
  }
  const d = `M ${p1.x} ${p1.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${p2.x} ${p2.y}`;
  return { d, lx: (p1.x + p2.x) / 2, ly: (p1.y + p2.y) / 2 - 7,
    pts: sampleCubic(p1, c1, c2, p2), tip: p2 };
}

/* ---- GEOMETRY LINTER ----------------------------------------------------
   A deterministic pass over every scenario's node/edge geometry that catches
   the visual defects a human spots instantly but data-reading can't: an edge
   that cuts through a box it doesn't connect to, an arrowhead landing inside a
   card, an edge label crowding a neighbor, or two node cards overlapping.
   It's math on the same coordinates the renderer uses (no browser layout), so
   it runs headlessly and reproducibly. review.sh dumps its output as text;
   review mode also paints it as a banner. This is the "table-stakes" gate:
   green here means the classes of overlap we know about are provably absent. */
const LABEL_CLEARANCE = 8;   // min px between a label's box and any non-endpoint card
const rectOf = n => ({ x1: n.x, y1: n.y, x2: n.x + nw(n), y2: n.y + nh(n) });
function segHitsRect(a, b, r, pad = 0) {   // does segment a→b enter rect r (padded)?
  const R = { x1: r.x1 - pad, y1: r.y1 - pad, x2: r.x2 + pad, y2: r.y2 + pad };
  // Sample the segment; cheap and robust for our scale (paths are pre-sampled).
  const N = 12;
  for (let i = 0; i <= N; i++) {
    const t = i / N, x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
    if (x >= R.x1 && x <= R.x2 && y >= R.y1 && y <= R.y2) return true;
  }
  return false;
}
function ptInRect(p, r, pad = 0) {
  return p.x >= r.x1 - pad && p.x <= r.x2 + pad && p.y >= r.y1 - pad && p.y <= r.y2 + pad;
}
function rectsOverlap(a, b, pad = 0) {
  return a.x1 < b.x2 + pad && a.x2 + pad > b.x1 && a.y1 < b.y2 + pad && a.y2 + pad > b.y1;
}
/* True rendered half-width of an edge-label pill. The pill draws its text in the
   body font at 10px/700 with .3px letter-spacing, plus a 3px --canvas halo on
   each side (box-shadow spread). A per-character guess underestimates real font
   metrics — which once let an 8-char label read "clean" while visibly crowding
   the cards it sits between. So measure the actual text with a canvas 2d context
   (same font the pill uses) and add the halo, so the verdict matches the pixels.
   Falls back to a conservative estimate only if no DOM exists. */
let _measureCtx = null;
function labelHalfWidth(lbl) {
  const HALO = 3, PAD = 2;                 // box-shadow spread each side + AA slack
  if (typeof document !== "undefined") {
    if (!_measureCtx) {
      _measureCtx = document.createElement("canvas").getContext("2d");
      _measureCtx.font = '700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
      try { _measureCtx.letterSpacing = "0.3px"; } catch (e) {}
    }
    return _measureCtx.measureText(String(lbl)).width / 2 + HALO + PAD;
  }
  return 3.6 * String(lbl).length + HALO + PAD;
}
function lintScenario(scenario) {
  const byId = Object.fromEntries(scenario.nodes.map(n => [n.id, n]));
  const issues = [];
  // 1. Node cards overlapping each other.
  for (let i = 0; i < scenario.nodes.length; i++)
    for (let j = i + 1; j < scenario.nodes.length; j++) {
      const a = scenario.nodes[i], b = scenario.nodes[j];
      if (rectsOverlap(rectOf(a), rectOf(b)))
        issues.push(`nodes "${a.id}" and "${b.id}" overlap — spread them apart`);
    }
  for (const e of scenario.edges) {
    const g = edgeGeo(byId, e);
    // 2. Edge path crossing a box that is neither endpoint.
    for (const n of scenario.nodes) {
      if (n.id === e.from || n.id === e.to) continue;
      const r = rectOf(n);
      let hit = false;
      for (let k = 0; k < g.pts.length - 1 && !hit; k++)
        if (segHitsRect(g.pts[k], g.pts[k + 1], r)) hit = true;
      if (hit) issues.push(`edge ${e.from}→${e.to} passes through node "${n.id}"`);
    }
    // 3. Arrowhead tip landing inside the target card (should sit on its edge).
    const tgt = byId[e.to];
    if (tgt && e.kind !== "ret" && ptInRect(g.tip, rectOf(tgt), -1))
      issues.push(`arrowhead of ${e.from}→${e.to} lands inside "${e.to}"`);
    // 4. Edge label crowding a card — INCLUDING its own endpoints. A label is
    //    centered in the gap between the two boxes it connects, so the most
    //    common real defect is a label too wide for that gap, overrunning the
    //    very cards it joins (an earlier version skipped endpoints and so went
    //    blind to exactly this). Measure the pill's true rendered width and
    //    require LABEL_CLEARANCE of daylight from every card, endpoints too.
    const lbl = e.label != null ? e.label : EDGE_LABEL[e.kind];
    if (lbl) {
      const halfW = labelHalfWidth(lbl), halfH = 9;
      const box = { x1: g.lx - halfW, y1: g.ly - halfH, x2: g.lx + halfW, y2: g.ly + halfH };
      for (const n of scenario.nodes) {
        if (!rectsOverlap(box, rectOf(n), LABEL_CLEARANCE)) continue;
        const endpoint = n.id === e.from || n.id === e.to;
        issues.push(endpoint
          ? `label "${lbl}" (${e.from}→${e.to}) doesn't fit the gap between its own cards — it's within ${LABEL_CLEARANCE}px of "${n.id}". Shorten the label or spread ${e.from} and ${e.to} apart.`
          : `label "${lbl}" (${e.from}→${e.to}) is within ${LABEL_CLEARANCE}px of card "${n.id}" — shorten it or spread the nodes`);
      }
    }
  }
  return issues;
}
function lintAll() {
  const all = [];
  for (const s of SCENARIOS)
    for (const msg of lintScenario(s)) all.push({ scenario: s.id, msg });
  // Expose for the headless reviewer to read out of the DOM as plain text.
  if (typeof document !== "undefined") {
    const el = document.createElement("div");
    el.id = "geometry-lint";
    el.setAttribute("data-clean", all.length === 0 ? "1" : "0");
    el.style.display = "none";
    el.textContent = all.length
      ? all.map(x => `[${x.scenario}] ${x.msg}`).join("\n")
      : "clean";
    document.body.appendChild(el);
  }
  return all;
}

function GraphCanvas({ scenario, step }) {
  const active = scenario.steps[step];
  const byId = useMemo(() => Object.fromEntries(scenario.nodes.map(n => [n.id, n])), [scenario]);

  const edgeInfo = scenario.edges.map((e, i) => {
    const eid = e.from + "-" + e.to;
    const on = active.activeEdges.includes(eid);
    const ret = e.kind === "ret";
    const g = edgeGeo(byId, e);
    const lbl = e.label != null ? e.label : EDGE_LABEL[e.kind];
    // A custom label (a specific action) stays plain text; only a bare
    // protocol label doubles as a glossary chip.
    const helpTerm = (e.label == null && !e.skipHelp) ? EDGE_LABEL_TERM[e.kind] : null;
    const mk = on ? (ret ? "url(#arrow-r)" : "url(#arrow-a)") : "url(#arrow)";
    return { e, i, on, ret, g, lbl, helpTerm, mk };
  });

  return (
    <div className="canvas-wrap">
      <svg className="canvas-svg" viewBox={`0 0 ${CW} ${CH}`} role="img" aria-label={scenario.title + " diagram"}>
        {/* swim-lane backgrounds — stop at CORPUS_X so corpus column is neutral */}
        {(scenario.lanes || []).map((ln, i) => {
          const LABEL_W = 82;
          const lh = ln.y2 - ln.y1;
          return (
            <g key={"ln" + i}>
              {/* tinted field (only up to corpus column) */}
              <rect x={LABEL_W} y={ln.y1} width={CORPUS_X - LABEL_W} height={lh} fill={ln.fill} />
              {/* label strip */}
              <rect x={0} y={ln.y1} width={LABEL_W} height={lh} fill={ln.color ? ln.color.replace(/[\d.]+\)$/, "0.15)") : "rgba(0,0,0,.08)"} />
              <foreignObject x={0} y={ln.y1} width={LABEL_W} height={lh}>
                <div style={{
                  width: LABEL_W + "px", height: lh + "px",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  padding: "0 10px", boxSizing: "border-box",
                }}>
                  <span style={{
                    fontSize: "12px", fontWeight: 800, letterSpacing: "0.8px",
                    color: ln.color || "rgba(0,0,0,.5)", fontFamily: "var(--font)",
                    textTransform: "uppercase", textAlign: "center", lineHeight: 1.4,
                    overflowWrap: "break-word", wordBreak: "normal",
                  }}>{ln.label}</span>
                </div>
              </foreignObject>
              {/* divider (only in the lane zone, not the corpus) */}
              {i > 0 && <line x1={LABEL_W} y1={ln.y1} x2={CORPUS_X} y2={ln.y1} stroke="rgba(0,0,0,.12)" strokeWidth="1" strokeDasharray="6 4" />}
            </g>
          );
        })}
        {/* Salesforce Resources corpus panel — full height, shared by both lanes */}
        {(() => {
          const CORP_W = CW - CORPUS_X;
          const HDR_H = 32;
          return (<g>
            {/* Body fill below header */}
            <rect x={CORPUS_X} y={HDR_H} width={CORP_W} height={CH - HDR_H} fill="rgba(1,118,211,.05)" />
            {/* Header strip across the top */}
            <rect x={CORPUS_X} y={0} width={CORP_W} height={HDR_H} fill="rgba(1,118,211,.15)" />
            {/* Bottom edge of header strip */}
            <line x1={CORPUS_X} y1={HDR_H} x2={CW} y2={HDR_H} stroke="rgba(1,118,211,.20)" strokeWidth="1" />
            {/* Left separator */}
            <line x1={CORPUS_X} y1={0} x2={CORPUS_X} y2={CH} stroke="rgba(1,118,211,.25)" strokeWidth="1" />
            <foreignObject x={CORPUS_X} y={0} width={CORP_W} height={HDR_H}>
              <div style={{ width: CORP_W+"px", height: HDR_H+"px", display:"flex", alignItems:"center", justifyContent:"center", boxSizing:"border-box" }}>
                <span style={{ fontSize:"12px", fontWeight:800, letterSpacing:"0.8px", color:"rgba(1,118,211,.80)", fontFamily:"var(--font)", textTransform:"uppercase" }}>Salesforce Resources</span>
              </div>
            </foreignObject>
          </g>);
        })()}
        <defs />
        {/* edge paths (under nodes) */}
        {edgeInfo.map(({ i, ret, g, mk, on }) => (
          <path key={i} className={"edge" + (ret ? " ret" : "") + (on ? " active flow" : "")} d={g.d} />
        ))}
        {/* rider — a small logo that travels the path while its edge is active */}
        {edgeInfo.filter(({ e, on }) => e.pokeballRide && on).map(({ i, g }) => (
          <g key={"pb" + i} className="rider" transform="translate(-9,-9)">
            <Logo name={RIDER_LOGO} size={18} />
            <animateMotion dur="1.1s" repeatCount="indefinite" path={g.d} rotate="auto" />
          </g>
        ))}
        {/* nodes (over edges) via foreignObject for real text wrapping */}
        {scenario.nodes.map(n => {
          const overrides = (active.nodeOverrides && active.nodeOverrides[n.id]) || {};
          const node = { ...n, ...overrides };
          const on = active.activeNodes.includes(n.id);
          const anyOn = active.activeNodes.length > 0;
          const dim = anyOn && !on;
          const isSec = scenario.security && (n.type === "gateway" || n.type === "broker");
          const isFinalStep = step === scenario.steps.length - 1;
          const logo = (node.finalLogo && isFinalStep && on) ? node.finalLogo : node.logo;
          const nn = node;
          return (
            <foreignObject key={n.id} x={n.x} y={n.y - NPAD / 2} width={nw(n)} height={nh(n) + NPAD} style={{ overflow: "visible" }}>
              <div className="node-slot">
                <div className={"node" + (on ? " active" : "") + (dim ? " dim" : "") + (isSec ? " sec" : "")} style={{ position: "relative", height: nn.h ? (nn.h - 12) + "px" : undefined }}>
                  {isSec ? <span className="zt">🔒 zero-trust</span> : null}
                  <div className="nlogo">{logo ? <Logo name={logo} size={nn.w ? 36 : 28} /> : <span className={"nemoji n-" + nn.type} style={nn.w ? { fontSize: "26px" } : undefined}>{ICON[nn.type]}</span>}</div>
                  <div className="ntext">
                    <div className={"ntype n-" + nn.type}>{TYPE_LABEL[nn.type]}</div>
                    <div className="nlabel" style={nn.w ? { fontSize: "14px" } : undefined}>{nn.label}{nn.helpTerm ? <Help id={nn.helpTerm} /> : null}</div>
                    {nn.sub ? <div className="nsub" style={nn.w ? { fontSize: "11px" } : undefined}>{nn.sub}</div> : null}
                {nn.ctxFill != null && (
                  <div style={{ marginTop: "6px" }}>
                    <div style={{ fontSize: "7px", fontWeight: 800, letterSpacing: ".5px", textTransform: "uppercase", lineHeight: 1, marginBottom: "3px",
                      color: nn.ctxFill >= 0.85 ? "var(--danger)" : "var(--slate)" }}>
                      Context Window{nn.ctxFill >= 0.85 ? " — FLOODED" : ""}
                    </div>
                    <div style={{ height: "8px", borderRadius: "4px", background: "rgba(0,0,0,.10)", overflow: "hidden",
                      boxShadow: nn.ctxFill >= 0.85 ? "0 0 0 1.5px var(--danger)" : "none" }}>
                      <div style={{ height: "100%", width: Math.round(nn.ctxFill * 100) + "%", borderRadius: "4px",
                        background: nn.ctxFill >= 0.85 ? "var(--danger)" : nn.ctxFill > 0.5 ? "var(--warn)" : "var(--good)",
                        transition: "width .4s ease, background .4s ease" }} />
                    </div>
                  </div>
                )}
                  </div>
                </div>
              </div>
            </foreignObject>
          );
        })}
        {/* edge labels (top layer, so nodes never paint over them) */}
        {edgeInfo.map(({ i, on, ret, g, lbl, helpTerm }) => {
          if (!lbl) return null;
          if (helpTerm) {
            return (
              <foreignObject key={"l" + i} x={g.lx - 55} y={g.ly - 12} width={110} height={22} style={{ overflow: "visible" }}>
                <div style={{ display: "flex", justifyContent: "center" }}>
                  <span className={"edge-label-chip" + (on ? " active" : "")}><Help id={helpTerm} /></span>
                </div>
              </foreignObject>
            );
          }
          // Plain label: an opaque pill on the top layer. The pill background
          // means that even where a label sits close to a neighboring card, the
          // text stays legible (no ambiguous overlap of ink on ink). The linter
          // still enforces a hard clearance so labels don't crowd cards.
          return (
            <foreignObject key={"l" + i} x={g.lx - 60} y={g.ly - 15} width={120} height={22} style={{ overflow: "visible" }}>
              <div style={{ display: "flex", justifyContent: "center" }}>
                <span className={"edge-label-pill" + (ret ? " ret" : "") + (on ? " active" : "")}>{lbl}</span>
              </div>
            </foreignObject>
          );
        })}
      </svg>
    </div>
  );
}

/* =====================================================================
   NARRATOR + SHELL — the walkthrough controls and page chrome.
   ===================================================================== */
function StepNarrator({ scenario, step, setStep }) {
  const total = scenario.steps.length;
  const s = scenario.steps[step];
  return (
    <div>
      <div className="controls">
        <button className="btn" disabled={step === 0} onClick={() => setStep(step - 1)}>← Back</button>
        <button className="btn primary" disabled={step === total - 1} onClick={() => setStep(step + 1)}>Next step →</button>
        <div className="steppips">
          {scenario.steps.map((_, i) => (
            <div key={i} className={"pip" + (i === step ? " active" : i < step ? " done" : "")} onClick={() => setStep(i)} />
          ))}
        </div>
        <span className="stepcount">Step {step + 1} of {total}</span>
      </div>
      <div className="narrator">
        <div className="step-n">Step {step + 1}</div>
        <p className="narration" dangerouslySetInnerHTML={{ __html: s.narration }} />
        <details className="hood">
          <summary><span className="chev">▸</span> Under the hood</summary>
          <div className="hood-body" dangerouslySetInnerHTML={{ __html: s.hood }} />
        </details>
        {scenario.security ? (
          <div className="note">🔒 <span dangerouslySetInnerHTML={{ __html: scenario.security }} /></div>
        ) : null}
      </div>
    </div>
  );
}

function ScenarioView({ scenario, step }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      <div className="scene-head">
        <div className="eyebrow">{scenario.eyebrow}</div>
        <h1>{scenario.title}</h1>
      </div>
      <GraphCanvas scenario={scenario} step={step} />
    </div>
  );
}

/* Review mode: one canvas per step, stacked, no controls — the "contact sheet"
   a screenshot can capture in a single shot for visual self-review. Renders
   every scenario so multi-scenario files are reviewed in one pass. */
function ReviewSheet() {
  // Run the geometry linter once and surface it: a banner at the top of the
  // contact sheet (so the screenshot shows it) plus a hidden #geometry-lint
  // node review.sh reads as text. Green banner = the known overlap classes are
  // provably absent; you still eyeball the render for judgment calls.
  const lint = useMemo(() => lintAll(), []);
  return (
    <div className="main">
      <div className={"lint-banner" + (lint.length ? " bad" : " ok")}>
        {lint.length
          ? <><b>⚠ geometry linter: {lint.length} issue{lint.length > 1 ? "s" : ""}</b>
              <ul>{lint.map((x, k) => <li key={k}><code>[{x.scenario}]</code> {x.msg}</li>)}</ul></>
          : <b>✓ geometry linter clean — no overlapping cards, boxed-through edges, buried arrowheads, or crowded labels</b>}
      </div>
      {SCENARIOS.map(scenario => (
        <div key={scenario.id}>
          <div className="scene-head">
            <div className="eyebrow">{scenario.eyebrow}</div>
            <h1>{scenario.title}</h1>
          </div>
          {scenario.steps.map((s, i) => (
            <div className="review-step" key={i}>
              <div className="review-cap">
                <span className="rn">Step {i + 1}/{scenario.steps.length}</span>
                <span dangerouslySetInnerHTML={{ __html: s.narration }} />
              </div>
              <GraphCanvas scenario={scenario} step={i} />
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

/* Topbar: brand lockup + optional status chip. Edit the text/logos. */
function TopBar() {
  return (
    <div className="topbar">
      <div className="brandlogos">
        <Logo name="sfcloud" size={24} />
      </div>
      <div className="lockup">
        <span className="title">Headless 360 MCP Server</span>
        <span className="from">Context-efficient Agent Tool Usage</span>
      </div>
      <div className="spacer" />
      <a
        className="badge-chip"
        href="https://developer.salesforce.com/blogs/2026/07/announcing-the-headless-360-mcp-server-beta"
        target="_blank"
        rel="noopener noreferrer"
        title="Announcing the Headless 360 MCP Server Beta"
      >
        <span className="dot" />
        Developers Blog
        <svg className="ext-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M14 4h6v6" />
          <path d="M10 14 20 4" />
          <path d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5" />
        </svg>
      </a>

}

function SideRail({ scenario, step, setStep }) {
  const total = scenario.steps.length;
  const s = scenario.steps[step];
  const pct = Math.round((step / (total - 1)) * 100);
  return (
    <nav className="rail">
      <div className="rail-steps">
        <div className="rail-step-dots">
          {scenario.steps.map((_, i) => (
            <div key={i}
              className={"rail-step-dot" + (i === step ? " active" : i < step ? " done" : "")}
              onClick={() => setStep(i)}
              title={"Step " + (i + 1)}
            />
          ))}
        </div>
      </div>
      <div className="rail-narrator">
        <div>
          <div className="rail-section-label">Step {step + 1}</div>
          <div className="rail-narration" dangerouslySetInnerHTML={{ __html: s.narration }} />
        </div>
        <div>
          <div className="rail-section-label">Under the hood</div>
          <div className="rail-hood-body" dangerouslySetInnerHTML={{ __html: s.hood }} />
        </div>
      </div>
      <div className="rail-nav">
        <button className="btn" disabled={step === 0} onClick={() => setStep(step - 1)}>← Back</button>
        <button className="btn primary" disabled={step === total - 1} onClick={() => setStep(step + 1)}>Next →</button>
      </div>
    </nav>
  );
}

function App() {
  const [active, setActive] = useState(SCENARIOS[0].id);
  const scenario = SCENARIOS.find(s => s.id === active);
  const [step, setStep] = useState(0);
  const total = scenario.steps.length;

  // Reset step when scenario changes
  useEffect(() => { setStep(0); }, [active]);

  // Keyboard nav: ← / → arrows
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") setStep(s => Math.min(s + 1, total - 1));
      if (e.key === "ArrowLeft"  || e.key === "ArrowUp")   setStep(s => Math.max(s - 1, 0));
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [total]);

  const review = typeof location !== "undefined" && /[?&]review\b/.test(location.search);
  if (review) {
    return (
      <div className="app review">
        <TopBar />
        <ReviewSheet />
        <HelpOverlay />
      </div>
    );
  }
  return (
    <div className="app">
      <TopBar />
      <div className="body">
        <SideRail scenario={scenario} step={step} setStep={setStep} />
        <main className="main">
          <ScenarioView key={scenario.id} scenario={scenario} step={step} />
        </main>
      </div>
      <HelpOverlay />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  // Transform JSX with the CLASSIC runtime (React.createElement) so it runs in
  // a plain browser <script>. The automatic runtime emits an ES-module
  // `import` that a non-module script cannot execute — do NOT switch this to
  // type="text/babel"; that path can't pass the runtime option and breaks
  // offline rendering. The JSX lives in the <script type="text/plain"> above,
  // is transformed here at load, then injected as a real script.
  (function () {
    try {
      var src = document.getElementById("app-source").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      var s = document.createElement("script");
      s.textContent = out;
      document.body.appendChild(s);
    } catch (err) {
      document.getElementById("root").innerHTML =
        '<pre style="padding:24px;color:#b00;font:13px monospace;white-space:pre-wrap">' +
        "App failed to start:\n" + (err && err.stack || err) + "</pre>";
      console.error(err);
    }
  })();
</script>
